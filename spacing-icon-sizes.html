<!DOCTYPE html>
<!-- @dsCard group="Spacing" name="Spacing — Icon sizes" subtitle="18 / 24 / 36 / 48 on 24px grid" viewport="700x150" -->
<html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<script src="https://unpkg.com/lucide@0.456.0/dist/umd/lucide.min.js"></script>
<style>
  body{margin:0;background:#fff;padding:26px 28px;color:var(--fg-1);display:flex;gap:30px;align-items:flex-end}
  .box{text-align:center}
  .ic{display:flex;align-items:center;justify-content:center}
  .ic svg{color:var(--azul-entel);stroke-width:1.5}
  .nm{font-family:var(--font-display);font-weight:600;font-size:13px;margin-top:10px}
  .lab{font-family:var(--font-ui);font-size:11px;color:var(--gris-600);margin-top:2px}
  .note{margin-left:auto;max-width:200px;font-family:var(--font-ui);font-size:11px;color:var(--gris-600);line-height:1.4}
</style></head><body>
  <div class="box"><div class="ic"><i data-lucide="signal" width="18" height="18"></i></div><div class="nm">Small</div><div class="lab">18px</div></div>
  <div class="box"><div class="ic"><i data-lucide="signal" width="24" height="24"></i></div><div class="nm">Medium</div><div class="lab">24px</div></div>
  <div class="box"><div class="ic"><i data-lucide="signal" width="36" height="36"></i></div><div class="nm">Large</div><div class="lab">36px</div></div>
  <div class="box"><div class="ic"><i data-lucide="signal" width="48" height="48"></i></div><div class="nm">XLarge</div><div class="lab">48px</div></div>
  <div class="note">Grilla de 24px · trazo único · Azul Entel si es interactivo. (Lucide, sustituto)</div>
  <script>lucide.createIcons();</script>
</body></html>
