<!DOCTYPE html>
<!-- @dsCard group="Colors" name="Color — Primary" subtitle="Azul Entel · Naranjo Entel · Blanco" viewport="700x240" -->
<html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;background:#fff;padding:24px 28px;color:var(--fg-1)}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  .sw{border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--line)}
  .chip{height:104px;display:flex;align-items:flex-end;padding:10px}
  .meta{padding:10px 12px}
  .nm{font-family:var(--font-display);font-weight:700;font-size:15px}
  .hex{font-family:var(--font-ui);font-size:12px;color:var(--gris-600);margin-top:2px}
  .use{font-family:var(--font-ui);font-size:11px;color:var(--gris-600);margin-top:4px;line-height:1.35}
</style></head><body>
  <div class="grid">
    <div class="sw"><div class="chip" style="background:var(--azul-entel)"></div><div class="meta"><div class="nm">Azul Entel</div><div class="hex">#002EFF</div><div class="use">Protagonista. Títulos, precios, links, CTAs, paréntesis.</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--naranjo-entel)"></div><div class="meta"><div class="nm">Naranjo Entel</div><div class="hex">#FF3D00</div><div class="use">Acento. Destacados, iconografía, 5G. Bajo porcentaje.</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--blanco)"></div><div class="meta"><div class="nm">Blanco</div><div class="hex">#FFFFFF</div><div class="use">Color predominante de toda pieza.</div></div></div>
  </div>
</body></html>
