<!DOCTYPE html>
<!-- @dsCard group="Brand" name="Brand — Parenthesis device" subtitle="The signature ( ) graphic" viewport="700x200" -->
<html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;background:#fff;padding:24px 28px;color:var(--fg-1);display:flex;align-items:center;gap:36px}
  .demo{flex:none;width:230px;height:150px;background:var(--azul-entel);border-radius:var(--radius-md);position:relative;overflow:hidden}
  .demo .pp{position:absolute;right:-30px;top:-28px;height:210px}
  .demo .txt{position:absolute;left:18px;bottom:16px;color:#fff;font-family:var(--font-display);font-weight:400;font-size:22px;line-height:1.05;max-width:130px}
  .specs{font-family:var(--font-ui);font-size:12px;color:var(--gris-600);line-height:1.6}
  .specs b{font-family:var(--font-display);color:var(--fg-1)}
  .row{display:flex;gap:14px;align-items:center;margin-top:4px}
  .row img{height:60px}
</style></head><body>
  <div class="demo">
    <img class="pp" src="../assets/paren-naranjo.svg">
    <div class="txt">Contigo en todas</div>
  </div>
  <div>
    <div class="specs"><b>El paréntesis</b> — recurso gráfico identitario.<br>≈150–250% del lado más largo · muestra ambas esquinas (o la izquierda) · nunca rotado ni recoloreado fuera de paleta.</div>
    <div class="row">
      <img src="../assets/paren-azul.svg">
      <img src="../assets/paren-naranjo.svg">
      <img src="../assets/paren-verde.svg">
      <img src="../assets/paren-pair.svg">
    </div>
  </div>
</body></html>
