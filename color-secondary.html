<!DOCTYPE html>
<!-- @dsCard group="Colors" name="Color — Secondary" subtitle="Azul Negocios · Verde Eco · Black" viewport="700x240" -->
<html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;background:#fff;padding:24px 28px;color:var(--fg-1)}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  .sw{border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--line)}
  .chip{height:104px}
  .meta{padding:10px 12px}
  .nm{font-family:var(--font-display);font-weight:700;font-size:15px}
  .hex{font-family:var(--font-ui);font-size:12px;color:var(--gris-600);margin-top:2px}
  .use{font-family:var(--font-ui);font-size:11px;color:var(--gris-600);margin-top:4px;line-height:1.35}
</style></head><body>
  <div class="grid">
    <div class="sw"><div class="chip" style="background:var(--azul-negocios)"></div><div class="meta"><div class="nm">Azul Negocios</div><div class="hex">#10069F</div><div class="use">Empresas & Corporaciones. Tono formal, fondos.</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--verde-eco)"></div><div class="meta"><div class="nm">Verde Eco</div><div class="hex">#42E8B4</div><div class="use">Ofertas, descuentos y promociones.</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--negro)"></div><div class="meta"><div class="nm">Black</div><div class="hex">#000000</div><div class="use">Excepcional. Texto, tech, Black Friday.</div></div></div>
  </div>
</body></html>
