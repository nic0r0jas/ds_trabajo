<!DOCTYPE html>
<!-- @dsCard group="Components" name="Component — Cards" subtitle="Plan card + promo card" viewport="700x290" -->
<html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<script src="https://unpkg.com/lucide@0.456.0/dist/umd/lucide.min.js"></script>
<style>
  body{margin:0;background:var(--gris-010);padding:24px 28px;color:var(--fg-1);display:grid;grid-template-columns:1fr 1fr;gap:18px}
  .card{background:#fff;border-radius:var(--radius-lg);box-shadow:var(--shadow-md);overflow:hidden}
  .plan{padding:20px 22px}
  .tag{display:inline-block;font-family:var(--font-ui);font-weight:600;font-size:11px;color:var(--azul-entel);background:var(--azul-claro);padding:4px 10px;border-radius:var(--radius-pill)}
  .pname{font-family:var(--font-display);font-weight:700;font-size:20px;margin:12px 0 2px}
  .price{font-family:var(--font-display);font-weight:700;font-size:36px;color:var(--azul-entel);line-height:1}
  .per{font-family:var(--font-ui);font-size:12px;color:var(--gris-600)}
  ul{list-style:none;padding:0;margin:14px 0 0;font-family:var(--font-ui);font-size:13px;color:var(--fg-1)}
  li{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  li svg{color:var(--azul-entel);stroke-width:2}
  .promo{padding:20px 22px;background:var(--azul-entel);color:#fff;display:flex;flex-direction:column;justify-content:space-between}
  .promo .off{font-family:var(--font-display);font-weight:700;font-size:15px;color:var(--verde-eco)}
  .promo h3{font-family:var(--font-display);font-weight:400;font-size:26px;margin:8px 0 0;line-height:1.05}
</style></head><body>
  <div class="card"><div class="plan">
    <span class="tag">Más vendido</span>
    <div class="pname">Entel Power +</div>
    <div><span class="price">$13.990</span> <span class="per">/ mes</span></div>
    <ul>
      <li><i data-lucide="check" width="16" height="16"></i> Gigas libres + redes sociales</li>
      <li><i data-lucide="check" width="16" height="16"></i> 5G donde la necesites</li>
    </ul>
  </div></div>
  <div class="card promo">
    <span class="off">33% dcto</span>
    <h3>Que tu negocio sea protagonista</h3>
  </div>
  <script>lucide.createIcons();</script>
</body></html>
