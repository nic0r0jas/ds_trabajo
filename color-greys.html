<!DOCTYPE html>
<!-- @dsCard group="Colors" name="Color — Grey scale" subtitle="Neutral surfaces, lines & text" viewport="700x210" -->
<html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;background:#fff;padding:24px 28px;color:var(--fg-1)}
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
  .sw{border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--line)}
  .chip{height:80px}
  .meta{padding:8px 10px}
  .nm{font-family:var(--font-display);font-weight:600;font-size:13px}
  .hex{font-family:var(--font-ui);font-size:11px;color:var(--gris-600);margin-top:1px}
</style></head><body>
  <div class="grid">
    <div class="sw"><div class="chip" style="background:var(--gris-010)"></div><div class="meta"><div class="nm">Gris 010</div><div class="hex">#F7F7F7</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--gris-100)"></div><div class="meta"><div class="nm">Gris 100</div><div class="hex">#E9E9E9</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--gris-200)"></div><div class="meta"><div class="nm">Gris 200</div><div class="hex">#D7D7D7</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--gris-600)"></div><div class="meta"><div class="nm">Gris 600</div><div class="hex">#66686C</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--negro)"></div><div class="meta"><div class="nm">Negro</div><div class="hex">#000000</div></div></div>
  </div>
  <div style="font-family:var(--font-ui);font-size:11px;color:var(--gris-600);margin-top:12px">Superficies suaves · líneas · inactivos · texto secundario · títulos & body</div>
</body></html>
