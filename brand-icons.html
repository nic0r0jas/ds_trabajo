<!DOCTYPE html>
<!-- @dsCard group="Brand" name="Brand — Iconography" subtitle="UI icons, Azul Entel (Lucide substitute)" viewport="700x230" -->
<html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<script src="https://unpkg.com/lucide@0.456.0/dist/umd/lucide.min.js"></script>
<style>
  body{margin:0;background:#fff;padding:22px 28px;color:var(--fg-1)}
  .lab{font-family:var(--font-ui);font-size:11px;color:var(--gris-600);margin:0 0 12px}
  .grid{display:flex;flex-wrap:wrap;gap:22px}
  .grid i{color:var(--azul-entel)}
  .grid svg{stroke-width:1.5}
  .onblue{margin-top:18px;background:var(--azul-entel);border-radius:var(--radius-md);padding:16px 22px;display:flex;gap:22px}
  .onblue i{color:#fff}
  .onblue svg{stroke-width:1.5}
</style></head><body>
  <p class="lab">Iconos UI · trazo único · Azul Entel si es interactivo · grilla 24px &nbsp;<i>(Lucide — sustituto flagged)</i></p>
  <div class="grid">
    <i data-lucide="smartphone" width="28" height="28"></i>
    <i data-lucide="wifi" width="28" height="28"></i>
    <i data-lucide="signal" width="28" height="28"></i>
    <i data-lucide="user" width="28" height="28"></i>
    <i data-lucide="credit-card" width="28" height="28"></i>
    <i data-lucide="map-pin" width="28" height="28"></i>
    <i data-lucide="bell" width="28" height="28"></i>
    <i data-lucide="settings" width="28" height="28"></i>
    <i data-lucide="search" width="28" height="28"></i>
    <i data-lucide="shopping-bag" width="28" height="28"></i>
  </div>
  <div class="onblue">
    <i data-lucide="house" width="28" height="28"></i>
    <i data-lucide="message-circle" width="28" height="28"></i>
    <i data-lucide="gift" width="28" height="28"></i>
    <i data-lucide="zap" width="28" height="28"></i>
  </div>
  <script>lucide.createIcons();</script>
</body></html>
