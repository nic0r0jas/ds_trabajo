<!DOCTYPE html>
<!-- @dsCard group="Type" name="Type — Families" subtitle="Barlow (display) + Inter (small UI)" viewport="700x210" -->
<html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;background:#fff;padding:24px 32px;color:var(--fg-1);display:flex;gap:48px}
  .fam{flex:1}
  .name{font-family:var(--font-display);font-weight:700;font-size:20px;margin-bottom:2px}
  .meta{font-family:var(--font-ui);font-size:11px;color:var(--gris-600);margin-bottom:14px}
  .glyphs{font-size:30px;line-height:1.25;letter-spacing:1px}
  .barlow{font-family:var(--font-display)}
  .inter{font-family:var(--font-ui)}
  .wts{display:flex;gap:14px;margin-top:10px;font-size:15px;color:var(--gris-600)}
  .wts span{font-family:inherit}
</style></head><body>
  <div class="fam barlow">
    <div class="name">Barlow</div>
    <div class="meta">Display & titles · grotesk, ligeramente redondeada</div>
    <div class="glyphs">Aa Bb Cc Gg Qq Rr</div>
    <div class="glyphs" style="font-size:22px">0123456789 ( ) &amp;</div>
    <div class="wts barlow"><span style="font-weight:400">Regular</span><span style="font-weight:500">Medium</span><span style="font-weight:700">Bold</span></div>
  </div>
  <div class="fam inter">
    <div class="name">Inter</div>
    <div class="meta">Small UI text · legibilidad en tamaños pequeños</div>
    <div class="glyphs">Aa Bb Cc Gg Qq Rr</div>
    <div class="glyphs" style="font-size:22px">0123456789 ( ) &amp;</div>
    <div class="wts inter"><span style="font-weight:400">Regular</span><span style="font-weight:500">Medium</span><span style="font-weight:700">Bold</span></div>
  </div>
</body></html>
