<!DOCTYPE html>
<!-- @dsCard group="Spacing" name="Spacing — Elevation" subtitle="Soft cool-tinted shadows + focus ring" viewport="700x175" -->
<html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;background:var(--gris-010);padding:30px 28px;color:var(--fg-1);display:flex;gap:26px;align-items:center}
  .box{flex:1;text-align:center}
  .sq{height:78px;background:#fff;border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:600;font-size:13px;color:var(--gris-600)}
  .lab{font-family:var(--font-ui);font-size:11px;color:var(--gris-600);margin-top:12px}
</style></head><body>
  <div class="box"><div class="sq" style="box-shadow:var(--shadow-sm)">sm</div><div class="lab">0 1 2 · /.06</div></div>
  <div class="box"><div class="sq" style="box-shadow:var(--shadow-md)">md</div><div class="lab">0 4 16 · azul/.08</div></div>
  <div class="box"><div class="sq" style="box-shadow:var(--shadow-lg)">lg</div><div class="lab">0 12 32 · azul/.12</div></div>
  <div class="box"><div class="sq" style="box-shadow:var(--shadow-focus)">focus</div><div class="lab">ring azul /.25</div></div>
</body></html>
