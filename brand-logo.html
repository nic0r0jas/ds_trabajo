<!DOCTYPE html>
<!-- @dsCard group="Brand" name="Brand — Logo lockups" subtitle="Isotipo e) + wordmark, pos & neg" viewport="700x250" -->
<html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;background:#fff;color:var(--fg-1);display:grid;grid-template-columns:1.6fr 1fr;font-family:var(--font-display)}
  .cell{padding:22px 26px;display:flex;flex-direction:column;gap:12px;justify-content:center;align-items:flex-start}
  .b{background:var(--azul-entel)}
  .cell .lock{height:46px;width:auto;display:block}
  .cell .iso{height:58px;width:auto;display:block}
  .lab{font-family:var(--font-ui);font-size:11px}
  .l-dark{color:var(--gris-600)}.l-light{color:rgba(255,255,255,.85)}
</style></head><body>
  <div class="cell"><img class="lock" src="../assets/entel-logo-horizontal-color.svg" alt="entel)"><div class="lab l-dark">Logotipo horizontal · positivo (vector real)</div></div>
  <div class="cell"><img class="iso" src="../assets/entel-isotipo-color.svg" alt="e)"><div class="lab l-dark">Isotipo · símbolo</div></div>
  <div class="cell b"><img class="lock" src="../assets/entel-logo-horizontal-blanco.svg" alt="entel)"><div class="lab l-light">Logotipo · negativo</div></div>
  <div class="cell b"><img class="iso" src="../assets/entel-isotipo-blanco.svg" alt="e)"><div class="lab l-light">Isotipo · negativo</div></div>
</body></html>
