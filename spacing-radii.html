<!DOCTYPE html>
<!-- @dsCard group="Spacing" name="Spacing — Radii" subtitle="xs → pill" viewport="700x185" -->
<html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;background:#fff;padding:26px 28px;color:var(--fg-1);display:flex;gap:18px;align-items:flex-end}
  .box{flex:1;text-align:center}
  .sq{height:84px;background:var(--azul-claro);border:1.5px solid var(--azul-entel)}
  .lab{font-family:var(--font-ui);font-size:11px;color:var(--gris-600);margin-top:8px}
  .nm{font-family:var(--font-display);font-weight:600;font-size:13px}
</style></head><body>
  <div class="box"><div class="sq" style="border-radius:var(--radius-xs)"></div><div class="nm">xs</div><div class="lab">4px</div></div>
  <div class="box"><div class="sq" style="border-radius:var(--radius-sm)"></div><div class="nm">sm</div><div class="lab">8px</div></div>
  <div class="box"><div class="sq" style="border-radius:var(--radius-md)"></div><div class="nm">md</div><div class="lab">12px</div></div>
  <div class="box"><div class="sq" style="border-radius:var(--radius-lg)"></div><div class="nm">lg</div><div class="lab">20px</div></div>
  <div class="box"><div class="sq" style="border-radius:var(--radius-pill)"></div><div class="nm">pill</div><div class="lab">999px</div></div>
</body></html>
