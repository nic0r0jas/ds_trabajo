<!DOCTYPE html>
<!-- @dsCard group="Brand" name="Brand — Expression" subtitle="B2C white vs B2B Azul Negocios" viewport="700x200" -->
<html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;background:#fff;padding:0;color:var(--fg-1);display:grid;grid-template-columns:1fr 1fr}
  .piece{position:relative;overflow:hidden;height:200px;padding:26px 28px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:flex-end}
  .b2c{background:#fff}
  .b2c .pp{position:absolute;right:-34px;top:-30px;height:240px}
  .b2c h3{font-family:var(--font-display);font-weight:400;font-size:30px;color:var(--azul-entel);margin:0;line-height:1.02}
  .b2c .price{font-family:var(--font-display);font-weight:700;font-size:34px;color:var(--azul-entel);margin-top:6px}
  .b2c .off{font-family:var(--font-display);font-weight:700;font-size:13px;color:#03372a;background:var(--verde-eco);padding:4px 10px;border-radius:var(--radius-pill);align-self:flex-start;margin-bottom:8px}
  .b2b{background:var(--azul-negocios);color:#fff}
  .b2b .pp{position:absolute;left:-34px;bottom:-30px;height:240px;opacity:.9}
  .b2b h3{font-family:var(--font-display);font-weight:400;font-size:28px;margin:0;line-height:1.05;position:relative}
  .b2b .lab{font-family:var(--font-ui);font-size:11px;color:rgba(255,255,255,.75);margin-top:8px;position:relative}
</style></head><body>
  <div class="piece b2c">
    <img class="pp" src="../assets/paren-azul.svg">
    <span class="off">33% dcto</span>
    <h3>Cobertura donde la necesites</h3>
    <div class="price">$13.990</div>
  </div>
  <div class="piece b2b">
    <img class="pp" src="../assets/paren-blanco.svg">
    <h3>Que tu negocio sea protagonista</h3>
    <div class="lab">Entel Empresas · Azul Negocios</div>
  </div>
</body></html>
